<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dff4e7"><link rel="stylesheet" href="/style.css"><title>Water Magic — Разработчик</title></head><body><main class="app"><header class="topbar"><div><p class="eyebrow">WATER MAGIC</p><h1>Экран разработчика 🪄</h1></div><a class="icon-btn" href="/" aria-label="На главную">🌱</a></header><section class="water-section"><h2>Напоминания</h2><p class="status">Настрой расписание и текст сообщений.</p><div id="reminders"></div><button class="primary wide" id="add">＋ Добавить напоминание</button></section><section class="water-section"><h2>Настройки растения</h2><label>Дневная цель, мл<input id="goal" type="number" min="500" max="5000" step="50"></label><button class="primary wide" id="save">Сохранить настройки</button></section><section class="water-section"><h2>Уведомления</h2><p class="status">В текущем прототипе браузерные уведомления работают, когда приложение открыто. Для надёжных push даже при закрытом приложении следующим шагом подключим серверную отправку.</p><button class="notify-btn" id="test">🔔 Тестовое уведомление</button></section></main><script src="/admin.js"></script></body></html>
